[project]
name = "insurance-cross-sell"
version = "0.1.0"
description = "Binary classification of insurance cross-sell (Kaggle Playground S4E7): production-ready ML pipeline."
authors = [{ name = "Roman Osipov", email = "oroma967@gmail.com" }]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1,<3",
    # <1.8: `penalty="elasticnet"` for LogisticRegression is deprecated from 1.8
    "scikit-learn>=1.5,<1.8",
    "lightgbm>=4.3",
    "catboost>=1.2.5",
    "optuna>=3.6",
    "joblib>=1.3",
]

[project.scripts]
insurance = "insurance_cross_sell.cli:main"

[tool.poetry]
packages = [{ include = "insurance_cross_sell", from = "src" }]
requires-poetry = ">=2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8"
pytest-cov = ">=5"
# Pinned to the same versions as the hooks in .pre-commit-config.yaml
ruff = "0.16.10"
mypy = "2.4.0"
pre-commit = ">=3.7"
nbstripout = ">=0.7"

# Only needed to re-run the EDA part of the notebook: `poetry install --with eda`
[tool.poetry.group.eda]
optional = true

[tool.poetry.group.eda.dependencies]
matplotlib = ">=3.8"
seaborn = ">=0.13"
phik = ">=0.12"
klib = ">=1.1"
shap = ">=0.45"
ipykernel = ">=6.29"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
# PEP 8: 79 characters for code, 72 for docstrings and comments
line-length = 79
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # research notebook is kept as-is

[tool.ruff.lint]
# E, W: pycodestyle (PEP 8); N: pep8-naming; D: docstrings (PEP 257)
select = ["E", "F", "W", "I", "N", "D", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "D"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
